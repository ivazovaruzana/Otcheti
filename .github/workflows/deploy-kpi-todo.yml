name: Deploy kpi-todo

# Пересобирает приложение kpi-todo и коммитит статику в kpi-todo/dist,
# откуда её раздаёт GitHub Pages (Settings → Pages → Deploy from branch:
# main / root). Запускается только при изменениях в самом приложении —
# правки в других отчётах или в README его не трогают.
on:
  push:
    branches: [main]
    paths:
      - 'kpi-todo/src/**'
      - 'kpi-todo/data/**'
      - 'kpi-todo/index.html'
      - 'kpi-todo/package.json'
      - 'kpi-todo/package-lock.json'
      - 'kpi-todo/vite.config.js'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-kpi-todo
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kpi-todo/package-lock.json

      - name: Install dependencies
        working-directory: kpi-todo
        run: npm ci

      - name: Build
        working-directory: kpi-todo
        run: npm run build

      - name: Commit built site if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kpi-todo/dist
          if git diff --cached --quiet; then
            echo "Сборка не изменилась, коммит не нужен."
          else
            git commit -m "Автосборка kpi-todo/dist [skip ci]"
            git push
          fi
