name: Update README report list

# Перегенерирует список отчётов в README.md (между метками
# REPORTS:START / REPORTS:END) на основе scripts/update_readme.py.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'kpi-todo/dist/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate report list
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Обновить список отчётов в README [skip ci]"
            git push
          fi
