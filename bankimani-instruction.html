<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Инструкция: как начисляются и тратятся «Банкимани»</title>
<style>
  :root{
    --blue:#0D6EFD;--green:#3CD278;--purple:#7B5FE8;
    --red:#E5484D;--text:#1A1D29;--muted:#5B6270;
    --bg:#F7F8FA;--border:#E5E8EE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.55;}
  .wrap{max-width:1000px;margin:0 auto;padding:48px 32px 80px;}
  header{margin-bottom:36px;}
  .kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--blue);background:rgba(13,110,253,.08);padding:5px 12px;border-radius:20px;margin-bottom:14px;}
  h1{font-size:28px;margin:0 0 10px;}
  .subtitle{color:var(--muted);font-size:15px;margin:0;}

  .callout{border-left:4px solid var(--purple);background:rgba(123,95,232,.08);border-radius:8px;
    padding:14px 18px;font-size:14px;margin:20px 0;}
  .callout.green{border-left-color:var(--green);background:rgba(60,210,120,.08);}
  .callout.warn{border-left-color:#E8A33D;background:rgba(232,163,61,.1);}

  section{margin-bottom:40px;}
  h2{font-size:19px;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--border);
    display:flex;align-items:center;gap:10px;}
  h2 .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
    background:var(--blue);color:#fff;font-size:12px;font-weight:700;flex-shrink:0;}

  .steps{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps li{counter-increment:step;position:relative;padding:14px 18px 14px 54px;margin-bottom:10px;
    background:#fff;border:1px solid var(--border);border-radius:10px;font-size:14.5px;}
  .steps li::before{content:counter(step);position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;}
